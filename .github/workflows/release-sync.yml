name: Sync rustguac release

# Checks sol1/rustguac for a new release every hour. When one is out, it syncs the
# docs from that tag (which also sets the version and release date the site shows),
# runs the same checks as CI, commits the sync straight to main and deploys the site.
# No one needs to merge anything between releases.
#
# Commits pushed with GITHUB_TOKEN do not trigger pages.yml, so this workflow starts
# the deploy itself with workflow_dispatch (which GITHUB_TOKEN may trigger).
#
# A run with no new release changes nothing: it stops once it sees the site is
# already on the latest tag. If the checks fail, nothing is pushed.
#
# Copy that goes beyond the docs (src/content.mjs, screenshots) is refreshed by hand
# now and then. Each sync adds a comment with that release's review checklist to one
# open "Content review" issue, so the reviews pile up in one place until the next
# refresh closes it. A failed run opens an issue too (one at a time, so an hourly
# failure does not open an issue every hour). NOTIFY is assigned to both.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to sync (default: latest release)"
        required: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: sol1/rustguac
      NOTIFY: davekempe,jseifeddine
    steps:
      - uses: actions/checkout@v7

      - name: Find the release to sync
        id: release
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          tag="${INPUT_REF:-$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)}"
          current="$(node -p 'require("./content/docs/_source.json").ref')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$current" ]; then
            echo "Site is already on $tag."
          else
            echo "Syncing $current -> $tag."
            echo "sync=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.release.outputs.sync
        with:
          node-version: 24

      - name: Sync docs
        if: steps.release.outputs.sync
        run: node scripts/sync-docs.mjs --ref "${{ steps.release.outputs.tag }}"

      - name: Build and check at a domain root and under a subpath
        if: steps.release.outputs.sync
        run: |
          for url in https://sol1.github.io/rustguac-website http://127.0.0.1:8080; do
            SITE_URL="$url" node scripts/build.mjs 2>&1 | tee -a build.log
            node scripts/check.mjs
            npx --yes html-validate@9 "dist/**/*.html"
          done

      - name: Commit to main and deploy
        if: steps.release.outputs.sync
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs
          git commit -m "docs: sync rustguac $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main

      - name: Note the release on the content review issue
        if: steps.release.outputs.sync
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          minor="$(echo "$version" | cut -d. -f1,2)"
          headline="$(node --input-type=module -e 'const m = await import("./src/content.mjs"); console.log(m.release?.version ?? "")')"

          {
            echo "### [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) is live"
            echo
            echo "The docs, version and release date are synced and deployed. Left for the next content refresh:"
            echo
            echo "- [ ] Read the [release notes](https://github.com/$UPSTREAM/releases/tag/$TAG) and update copy in \`src/content.mjs\` for new or changed features."
            if [ "$headline" != "$minor" ]; then
              echo "- [ ] Set \`release\` in \`src/content.mjs\` to the $minor headline. Until then the home page pill reads \"Release notes\"."
            fi
            echo "- [ ] If the UI changed, refresh the screenshots (README: Screenshots)."
            issues="$(grep -ohE 'issue: [0-9]+' content/docs-overlay/fixes.mjs src/docs/nav.mjs | grep -oE '[0-9]+' | sort -un)"
            if [ -n "$issues" ]; then
              echo
              echo "**Docs overlay** (remove entries for closed issues once their fix is in a release)"
              echo
              for n in $issues; do
                state="$(gh issue view "$n" -R "$UPSTREAM" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
                echo "- $UPSTREAM#$n: $state"
              done
            fi
            warnings="$(grep -E '^docs:|warn' build.log | sort -u || true)"
            if [ -n "$warnings" ]; then
              echo
              echo "**Build warnings**"
              echo
              echo '```'
              echo "$warnings"
              echo '```'
            fi
          } > comment.md

          title="Content review"
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -z "$open" ]; then
            open="$(gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --assignee "$NOTIFY" \
              --body "Releases synced since the last content refresh. The site already shows their docs and version; this tracks the copy and screenshots. Close it after a refresh, and the next sync opens a new one.")"
          fi
          gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Open an issue if the sync failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release sync failed"
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "Issue #$open is already open for a failed sync."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --assignee "$NOTIFY" \
              --body "The release sync failed in [run $GITHUB_RUN_ID]($RUN_URL). Fix the cause, re-run it from the Actions tab (or wait for the next hourly run), then close this issue."
          fi
