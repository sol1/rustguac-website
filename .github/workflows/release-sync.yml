name: Sync rustguac release

# Checks sol1/rustguac for a new release every hour. When one is out, it syncs the
# docs from that tag (which also sets the version and release date the site shows),
# runs the same checks as CI and opens a pull request with a review checklist.
# Merging the pull request deploys the site.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests". Pull requests opened with GITHUB_TOKEN do not trigger ci.yml, so
# this workflow runs those checks itself before opening one.
#
# A run with no new release changes nothing: it stops once it sees the site is
# already on the latest tag, or that the release branch (and its pull request) exists.
#
# NOTIFY is who hears about it: they are assigned and asked to review each sync pull
# request, and a failed run opens an issue assigned to them (one at a time, so an
# hourly failure does not open an issue every hour).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to sync (default: latest release)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: sol1/rustguac
      NOTIFY: davekempe,jseifeddine
    steps:
      - uses: actions/checkout@v7

      - name: Find the release to sync
        id: release
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          tag="${INPUT_REF:-$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)}"
          current="$(node -p 'require("./content/docs/_source.json").ref')"
          branch="release/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$current" ]; then
            echo "Site is already on $tag."
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; review its pull request."
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.release.outputs.sync
        with:
          node-version: 24

      - name: Sync docs
        if: steps.release.outputs.sync
        run: node scripts/sync-docs.mjs --ref "${{ steps.release.outputs.tag }}"

      - name: Build and check at a domain root and under a subpath
        if: steps.release.outputs.sync
        run: |
          for url in https://sol1.github.io/rustguac-website http://127.0.0.1:8080; do
            SITE_URL="$url" node scripts/build.mjs 2>&1 | tee -a build.log
            node scripts/check.mjs
            npx --yes html-validate@9 "dist/**/*.html"
          done

      - name: Open pull request
        if: steps.release.outputs.sync
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          version="${TAG#v}"
          minor="$(echo "$version" | cut -d. -f1,2)"
          headline="$(node --input-type=module -e 'const m = await import("./src/content.mjs"); console.log(m.release?.version ?? "")')"

          {
            echo "Syncs the docs from [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG). The site's version and release date follow from \`content/docs/_source.json\`."
            echo
            echo "**Before merging**"
            echo
            echo "- [ ] Read the [release notes](https://github.com/$UPSTREAM/releases/tag/$TAG) and update copy in \`src/content.mjs\` for new or changed features."
            if [ "$headline" != "$minor" ]; then
              echo "- [ ] Set \`release\` in \`src/content.mjs\` to the $minor headline. Until then the home page pill reads \"Release notes\"."
            fi
            echo "- [ ] If the UI changed, refresh the screenshots (README: Screenshots)."
            echo
            echo "**Docs overlay**"
            echo
            issues="$(grep -ohE 'issue: [0-9]+' content/docs-overlay/fixes.mjs src/docs/nav.mjs | grep -oE '[0-9]+' | sort -un)"
            if [ -z "$issues" ]; then
              echo "No overlay fixes."
            else
              for n in $issues; do
                state="$(gh issue view "$n" -R "$UPSTREAM" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
                echo "- $UPSTREAM#$n: $state"
              done
              echo
              echo "Remove overlay entries for closed issues once their fix is in this release."
            fi
            echo
            echo "**Build warnings**"
            echo
            echo '```'
            grep -E '^docs:|warn' build.log | sort -u || echo "none"
            echo '```'
            echo
            echo "Build, \`check.mjs\` and html-validate passed at a domain root and under a subpath."
          } > pr-body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add content/docs
          git commit -m "docs: sync rustguac $TAG"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Sync rustguac $TAG" --body-file pr-body.md \
            --assignee "$NOTIFY" --reviewer "$NOTIFY"

      - name: Open an issue if the sync failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release sync failed"
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "Issue #$open is already open for a failed sync."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --assignee "$NOTIFY" \
              --body "The release sync failed in [run $GITHUB_RUN_ID]($RUN_URL). Fix the cause, re-run it from the Actions tab (or wait for the next hourly run), then close this issue."
          fi
