name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Production (a project subpath) and a domain root.
        site_url: ["https://sol1.github.io/rustguac-website", "http://127.0.0.1:8080"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        env:
          SITE_URL: ${{ matrix.site_url }}
        run: node scripts/build.mjs
      - name: SEO, links, structured data, CSP, privacy
        run: node scripts/check.mjs
      - name: Validate HTML
        run: npx --yes html-validate@9 "dist/**/*.html"
      - name: Validate sitemap XML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout dist/sitemap.xml
